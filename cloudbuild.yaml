substitutions:
  _ARTIFACT_REGISTRY_REPO: "microservices-repo"
  _IMAGE_NAME: "site-bff"
  _LOCATION: "us-east1"

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  volumes:
    - name: 'maven-cache'
      path: '/root/.m2'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/sonar-cloud-token/versions/latest
      env: 'SONAR_CLOUD_TOKEN'

steps:
  - id: "Unit Test"
    name: 'maven:3.9-eclipse-temurin-21'
    args: [ 'mvn', 'clean', 'test' ]

  - id: "Start Firestore"
    name: 'gcr.io/cloud-builders/docker'
    args: [
      'run', '-d',
      '--network=cloudbuild',
      '--name=firestore',
      'gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators',
      'gcloud', 'emulators', 'firestore', 'start', '--project=local-project', '--host-port=0.0.0.0:8695'
    ]

  - id: "Start PubSub"
    name: 'gcr.io/cloud-builders/docker'
    args: [
      'run', '-d',
      '--network=cloudbuild',
      '--name=pubsub',
      'gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators',
      'gcloud', 'beta', 'emulators', 'pubsub', 'start', '--project=local-project', '--host-port=0.0.0.0:8085'
    ]

  - id: "Start Redis"
    name: 'gcr.io/cloud-builders/docker'
    args: [ 'run', '-d', '--network=cloudbuild', '--name=redis', 'redis:alpine' ]

  - id: "Wait for Services"
    name: 'ubuntu'
    args: [ 'sleep', '15' ]
    waitFor: [ "Start Firestore", "Start Redis", "Start PubSub" ]

  - id: "Integration Test"
    name: 'maven:3.9-eclipse-temurin-21'
    env:
      - 'FIRESTORE_EMULATOR_HOST=firestore:8695'
      - 'PUBSUB_EMULATOR_HOST=pubsub:8085'
      - 'SPRING_DATA_REDIS_HOST=redis'
      - 'SPRING_DATA_REDIS_PORT=6379'
    args: [ 'mvn', 'verify', '-Dspring.profiles.active=local' ]
    waitFor:
      - "Wait for Services"

  - id: "Cleanup"
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker stop firestore pubsub redis || true'

  - id: "Load on Sonar Cloud"
    name: 'maven:3.9.4-eclipse-temurin-17'
    entrypoint: 'bash'
    args:
      - -c
      - |
        mvn sonar:sonar \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=green-energy-tracker-cloud \
          -Dsonar.projectKey=$PROJECT_ID \
          -Dsonar.login=$$SONAR_CLOUD_TOKEN
    secretEnv: ['SONAR_CLOUD_TOKEN']

  - id: "Push to Artifact Registry"
    name: 'gcr.io/cloud-builders/mvn'
    args: [
      'com.google.cloud.tools:jib-maven-plugin:3.4.5:build',
      '-Dimage=$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_IMAGE_NAME:$COMMIT_SHA',
      '-DskipTests'
    ]

  - id: "Check Vulnerabilities"
    name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IMAGE_URI=$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_IMAGE_NAME
        for i in {1..30}; do
          STATUS=$(gcloud artifacts docker images list \
                    $$IMAGE_URI \
                    --sort-by="~createTime" \
                    --limit=1 \
                    --show-occurrences \
                    --format="value(discovery.analysisStatus)")
          if [[ "$$STATUS" == "FINISHED_SUCCESS" ]]; then
              CRITICAL_COUNT=$(gcloud artifacts docker images list \
                                $$IMAGE_URI \
                                --sort-by="~createTime" \
                                --limit=1 \
                                --show-occurrences \
                                --format="value(vuln_counts.CRITICAL)")
              if [[ "$$CRITICAL_COUNT" -gt 0 ]]; then
                  echo "❌ ERRORE: Trovate $$CRITICAL_COUNT vulnerabilità CRITICAL. Blocco il processo."
                  exit 1
              else
                  echo "✅ Nessuna vulnerabilità CRITICAL trovata. Procedo..."
                  exit 0
              fi
          fi
          echo "Stato attuale: $$STATUS. Attendo 10 secondi..."
          sleep 10
        done
        echo "TIMEOUT: Scan did not complete within the time limit."
        exit 1