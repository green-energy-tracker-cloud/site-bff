substitutions:
  _ARTIFACT_REGISTRY_REPO: "microservices-repo"
  _IMAGE_NAME: "site-bff"
  _LOCATION: "us-east1"

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  volumes:
    - name: 'maven-cache'
      path: '/root/.m2'

steps:
  - id: "Unit Test"
    name: 'maven:3.9-eclipse-temurin-21'
    args: [ 'mvn', 'clean', 'test' ]

  - id: "Create CI Override"
    name: 'bash'
    script: |
      cat <<EOF > docker-compose.ci.yml
      version: '3.8'
      services:
        firestore:
          network_mode: cloudbuild
          ports: []
        pubsub:
          network_mode: cloudbuild
          ports: []
        redis:
          network_mode: cloudbuild
          ports: []
      EOF
    waitFor: ['Unit Test']

  - id: "Start Dependencies for Integration Test"
    name: 'docker/compose:1.29.2'
    args: [ '-f', 'docker-compose.yml', '-f', 'docker-compose.ci.yml', 'up', '-d' ]
    waitFor:
      - "Create CI Override"

  - id: "Wait for Firestore"
    name: 'ubuntu'
    args: [ 'sleep', '15' ]
    waitFor: [ "Start Dependencies for Integration Test" ]

  - id: "Debug Docker"
    name: 'gcr.io/cloud-builders/docker'  # <--- USA QUESTA IMMAGINE
    args: ['ps', '-a']
    waitFor: ['Wait for Firestore']

  - id: "Integration Test"
    name: 'maven:3.9-eclipse-temurin-21'
    env:
      - 'FIRESTORE_EMULATOR_HOST=localhost:8695'
      - 'PUBSUB_EMULATOR_HOST=localhost:8085'
    args: [ 'mvn', 'verify' ]
    waitFor:
      - "Debug Docker"

  - id: "Stop Dependencies"
    name: 'docker/compose:1.29.2'
    args: [ 'down' ]