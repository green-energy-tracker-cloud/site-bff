apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: site-bff
  labels:
    managed-by: google-cloud-deploy
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    spec:
      containers:
        - image: site-bff
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi