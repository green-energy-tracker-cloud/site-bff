apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: service-site-bff
spec:
  template:
    spec:
      containers:
        - image: site-bff
          ports:
            - containerPort: 8080
          startupProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 240
            periodSeconds: 10
            failureThreshold: 3
            tcpSocket:
              port: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi