spring:
  application:
    name: site-bff
  pagination:
    default:
      page: 0
      size: 10
  data:
    redis:
      prefix-key: site
      ttl-seconds: 3600
      host: localhost
      port: 6379
      repositories:
        enabled: false

  cloud:
    gcp:
      project-id: local-project
      core:
        credentials:
          enabled: false
      pubsub:
        emulator-host: localhost:8085
        topic:
          site-events: site-events
      firestore:
        emulator:
          enabled: true
        host-port: localhost:8695

retry:
  max-attempts: 3
  min-backoff-millis: 100
  max-backoff-millis: 1000
